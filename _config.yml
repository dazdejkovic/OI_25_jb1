# ==========================================
# Book settings
# ==========================================

title: Operaciona istraživanja
author: Dragan i Mladen
logo: ekof.jpeg

execute:
  execute_notebooks: force


# ==========================================
# PDF (LaTeX)
# ==========================================

latex:
  latex_documents:
    targetname: book.tex
  latex_engine: xelatex
  use_latexmk: false


# ==========================================
# Bibliografija
# ==========================================

bibtex_bibfiles:
  - references.bib


# ==========================================
# Repository info
# ==========================================

repository:
  url: https://github.com/executablebooks/jupyter-book
  path_to_book: docs
  branch: master


# ==========================================
# HTML settings
# ==========================================

html:
  use_issues_button: true
  use_repository_button: true

  # Ово укључује твоје локализоване темплејте:
  templates_path: ["_booktheme"]

  
  extra_js: 
    - "_static/sr_cyr2lat_ui.js"

    
  extra_css:
    - "_static/captions.css"


# ==========================================
# MyST extensions
# ==========================================

parse:
  myst_enable_extensions:
    - html_admonition
    - amsmath
    - dollarmath
    - colon_fence
    - html_image
    - deflist


# ==========================================
# Sphinx configuration + локализација
# ==========================================

sphinx:
  extra_extensions:
    - sphinx_proof
    - sphinx_jupyterbook_latex
    - sphinx_exercise

  config:

    # ✅ Локализација (HTML & Sphinx)
    language: sr
    numfig: true
    numfig_format:
      figure: "Slika %s."
      table: "Tabela %s."
      code-block: "Kod %s."      
    locale_dirs: ['locale/']
    gettext_compact: false
    html_permalinks: false
    html_permalinks_icon: ""

    # ✅ Proof оквири (локализовани)
    proof_theorem_types:
      example: Primer
      theorem: Teorema
      definition: Definicija
      lemma: Lema
      corollary: Posledica

    # ✅ PDF локализација (latinica)
    latex_elements:
      babel: |
        \usepackage{polyglossia}
        \setdefaultlanguage[variant=latin]{serbian}
        \setotherlanguage{english}
        \setmainfont{Times New Roman}
        \setsansfont{Arial}
        \setmonofont{Consolas}
